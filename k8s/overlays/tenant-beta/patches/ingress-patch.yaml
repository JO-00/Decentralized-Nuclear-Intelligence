apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-ingress
  annotations:
    nginx.ingress.kubernetes.io/session-cookie-name: "NUCLEAR_ROUTE_BETA"
spec:
  rules:
    - host: beta.nuclear.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dataset-generation
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
