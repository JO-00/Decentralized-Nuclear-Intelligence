apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-service
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
    networking.nuclear.io/policy: intra-tenant-east-west
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dataset-generation
  policyTypes:
    - Ingress
  ingress:
    # Allow intra-tenant traffic from frontend to dataset generation API
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
    networking.nuclear.io/policy: intra-tenant-east-west
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Egress
  egress:
    # Allow frontend to send requests to dataset-generation within the same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dataset-generation
      ports:
        - protocol: TCP
          port: 8000
