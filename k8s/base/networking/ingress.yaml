apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-ingress
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # L7 Load Balancing Algorithm (least connections for stateful/heavy telemetry requests)
    nginx.ingress.kubernetes.io/load-balance: "least_conn"
    # Session Affinity (Sticky Sessions via HTTP cookie for consistent UI and stream state)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "NUCLEAR_ROUTE"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-conditional: "true"
    # L7 Rate Limiting & Connection Throttling per client IP
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "25"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    # Buffer and Timeout Tuning for telemetry streaming
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: tenant.nuclear.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dataset-generation
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
