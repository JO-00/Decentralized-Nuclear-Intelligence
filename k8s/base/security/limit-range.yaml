apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limit-range
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 1000m
        memory: 1Gi
      min:
        cpu: 25m
        memory: 32Mi
