apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-workload-sa
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-workload-role
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
rules:
  # Least-privilege role: can read configmaps within its own tenant namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-workload-binding
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
subjects:
  - kind: ServiceAccount
    name: tenant-workload-sa
roleRef:
  kind: Role
  name: tenant-workload-role
  apiGroup: rbac.authorization.k8s.io
