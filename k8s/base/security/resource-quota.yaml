apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-compute-quota
  labels:
    app.kubernetes.io/part-of: nuclear-safety-platform
spec:
  hard:
    # Compute limits to prevent noisy-neighbor starvation across tenants
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    # Pod count limit per tenant
    pods: "10"
    # Network object quotas (prevent unauthorized NodePorts / LoadBalancers)
    services.nodeports: "0"
    services.loadbalancers: "0"
    count/services: "5"
    count/ingresses.networking.k8s.io: "2"
    count/configmaps: "10"
    count/secrets: "5"
