services:
  dataset-generation:
    build: DatasetGeneration/
    ports:
      - "8000:8000"
    env_file:
      - DatasetGeneration/.env
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      DATASET_OUTPUT_DIR: /tmp

    container_name: dataset_generation
    command: uvicorn endpoint:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: frontend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  dataset_data:

